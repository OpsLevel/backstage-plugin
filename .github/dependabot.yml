version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      storybook:
        patterns:
          - "*storybook*"
      backstage:
        patterns:
          - '*@backstage*'
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"